# 공개 저장소 korea-valuation-insights 의 GitHub Actions 워크플로(P7-C3 적용). scripts/build_public_bundle.py 가
# 이 파일을 .github/workflows/ci.yml 로, docs/ci/test_public_app.py 를 tests/test_public_app.py 로 복사한다.
# 비밀값·KRX 자료 없이 도는 시험만: 공개 묶음에는 API 키·DB·시세가 없다(회사별 공개 스냅샷 = DART·ECOS 자료와 집계값).
name: ci

on:
  push:
    branches: [main, staging]   # P7-X2b: staging first (scripts/deploy_public.py), main only after CI passes
  pull_request:

permissions:
  contents: read            # 읽기만 (배포는 Streamlit Community Cloud가 main을 직접 읽는다)

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # P7-X2b: Node 24 versions (Node 20 is removed from GitHub-hosted runners, 2026-09-16), exact release tags
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0     # gitleaks 가 전체 이력을 본다
      - uses: actions/setup-python@v7.0.0      # v7.1.0 (2026-10-22) is newer but only hours old at the time of pinning
        with:
          python-version: "3.13"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.4.2
      - name: secret scan (gitleaks, whole history)
        if: runner.os == 'Linux'
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # GitHub가 주는 기본 토큰(저장소 비밀값을 새로 만들지 않음)
      # P7-D2 (D-F5): one command whose exit code decides. The lines before were `! git ls-files | grep ...` + a second
      # line; bash -e does not stop on a `!` command, so only the last line counted. Rules and cases: .github/ci_guard.py,
      # tests/test_ci_guard.py (top-level data/ outputs/ logs/, *.duckdb, .env anywhere, key names; every commit too)
      - name: no data / DB / key files (tree and whole history)
        run: python .github/ci_guard.py --history
      - name: tests (snapshots, replay, session files, workspaces, screens)
        env:
          PYTHONPATH: .
        run: pytest -q tests
