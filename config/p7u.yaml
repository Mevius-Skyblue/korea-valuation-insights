# 공개 축약본(P7-C3): 비공개 저장소 config/p7u.yaml에서 공개 앱이 읽는 최상위 키만 (delta_unit, events, glossary)
glossary:
  stats:
  - term: 중앙값
    def: 가운데 값(n개를 정렬했을 때 가운데)
  - term: 평균
    def: 합계 ÷ 개수
  - term: 1사분위
    def: 아래에서 25% 위치 값
  - term: 3사분위
    def: 아래에서 75% 위치 값
  - term: IQR
    def: 1~3사분위(가운데 50% 범위)
  - term: n
    def: 표본 수(건수·회사 수)
  paired:
  - term: 세후영업이익
    abbr: NOPAT
    def: EBIT × (1 − 법인세율)
  - term: 감가상각비
    abbr: D&A
    def: 유형자산 감가상각비 + 무형자산상각비
  - term: 자본적지출
    abbr: CAPEX
    def: 유형·무형자산 취득
  - term: 무위험이자율
    abbr: Rf
    def: 국고채 금리(기본 5년, 선택 10년)
  - term: 시장위험프리미엄
    abbr: MRP
    def: 주식시장 기대수익률 − 무위험이자율
  - term: 규모위험프리미엄
    abbr: SRP
    def: 작은 회사에 더하는 추가 할인율
  - term: 무부채 베타
    abbr: βu
    def: Peer 주가 베타에서 부채 효과를 뺀 값(사업 위험)
  - term: 부채비율
    abbr: D/E
    def: 부채 ÷ 자기자본 시가
  - term: 자기자본비용
    abbr: Ke
    def: Rf + βL × MRP + SRP
  - term: 타인자본비용
    abbr: Kd
    def: 세전 차입 금리
  - term: 신규투자수익률
    abbr: RONIC
    def: 새로 투자한 자본의 수익률(수렴·영구 구간 재투자율 = g ÷ RONIC)
  - term: 영구가치
    abbr: TV
    def: 예측 기간 뒤 현금흐름의 가치(Terminal Value)
  - term: 영구가치 비중
    abbr: TV
    def: 영구가치 현재가치 ÷ EV
  - term: 영구성장률
    abbr: g
    def: 예측 기간 뒤 현금흐름이 매년 자라는 비율
  - term: 수렴 구간
    abbr: Fade
    def: 명시 예측 뒤 성장률이 g로 줄어드는 구간
  - term: 기중 할인
    abbr: Mid-year
    def: 현금흐름이 기간 중간에 생긴다고 보고 할인
  - term: 현재가치
    abbr: PV
    def: 미래 금액 × 할인계수
  - term: 항상성장모형
    abbr: Gordon Growth
    def: TV = 다음 해 FCFF ÷ (WACC − g)
  - term: 출구 배수법
    abbr: Exit Multiple
    def: TV = 마지막 해 EBITDA × Peer EV/EBITDA 중앙값
  - term: 주주가치
    abbr: Equity
    def: EV − 순차입금 + 비영업자산 − 비지배지분
  - term: 주주가치 조정
    abbr: Bridge
    def: EV에서 주주가치로 가는 조정
  - term: 경영권 프리미엄
    abbr: CP
    def: 경영권 거래가 ÷ 공시 전 20일 VWAP − 1(과거 거래 집계)
  - term: 내재 소수지분 할인
    abbr: DLOC
    def: CP ÷ (1 + CP)
  - term: 거래량가중평균가
    abbr: VWAP
    def: 거래대금 합 ÷ 거래량 합(20거래일)
  - term: 연평균 성장률
    abbr: CAGR
    def: (끝 값 ÷ 시작 값)^(1/년수) − 1
  as_is:
  - DCF
  - PER
  - PBR
  - EV
  - EV/EBITDA
  - EV/Sales
  - EBITDA
  - EBIT
  - WACC
  - FCFF
  - LTM
  - IQR
  - Bear/Base/Bull
  korean_only:
  - term: 영업이익률
    tip: OPM = 영업이익 ÷ 매출
  - term: EBITDA 이익률
    tip: EBITDA ÷ 매출
  - term: 순운전자본 증가
    tip: ΔNWC = (매출채권 + 재고자산 − 매입채무)의 증가
  - term: 매출채권 회전일수
    tip: DSO = 매출채권 ÷ 매출 × 365
  - term: 재고자산 회전일수
    tip: DIO = 재고자산 ÷ 매출원가 × 365
  - term: 매입채무 회전일수
    tip: DPO = 매입채무 ÷ 매출원가 × 365
  - term: 내재
    tip: 'Implied: 결과값에서 거꾸로 계산한 값'
  - term: 배수
    tip: Multiple
  english_only:
  - Peer
  forbidden_on_screen:
  - pattern: (?<![가-힣A-Za-z0-9])피어
    why: Peer만(회사 이름 안의 글자 '스피어' 등은 제외, fix U1-F1)
  - pattern: (?<![A-Za-z0-9])Q[13](?![A-Za-z0-9])
    why: 분기로 읽힘 → 1사분위·3사분위
  - pattern: 하위 25%|상위 25%
    why: 1사분위·3사분위
  - pattern: 회전율
    why: 회전일수(일)와 섞지 않음
  internal_codes:
  - pattern: BU20|bu20
    why: 기준가 내부 이름
  - pattern: (?<![A-Za-z0-9])G[1-8]b?(?![A-Za-z0-9_])
    why: 게이트 번호
  - pattern: mechanical(_v2)?
    why: 경로명
  - pattern: (경로|방식)\s*v[12](?![0-9])|(?<![A-Za-z0-9])v[12]\s*(경로|방식)
    why: 경로명 v1/v2(버전 v0·v1… 표시는 허용)
  - pattern: \d{6}_\d{8}_\d{3}
    why: 세션 ID
  - pattern: P7-
    why: 개발 단계
events:
  sections:
  - id: after_asof
    label: 평가기준일 {as_of} 이후 · 후속 사건
  - id: bs_to_asof
    label: 재무기준일 {bs_date} → 평가기준일
  - id: before_bs
    label: 재무기준일 이전 · 참고
  sources:
    bs_to_asof: 초안 config draft_meta.post_bs_disclosures(이미 수집, 새 호출 없음)
    after_asof: PC 모드에서 [조회]를 누를 때만 OpenDART list.json 1회(corp_code, 평가기준일+1 ~ 오늘, 1쪽 100건; src.pipeline.collect.disclosures). 결과·시각을 세션 events_lookup에 저장, 실패 시 '조회 실패'. 공개 모드 = '스냅샷 기준 · 조회 안 함'. 개발·시험
      = 기록된 응답(fixture) — API 0
    before_bs: 설정의 출처 접수번호(사업보고서·반기보고서 등 평가에 쓴 정기보고서), 제목은 출처 글자에서
  row:
  - 접수일
  - 보고서명(제목 툴팁)
  - 구분
  - 가치 영향 태그
  - 검토
  - 원문 ↗(rcept_no 툴팁)
  link: https://dart.fss.or.kr/dsaf001/main.do?rcpNo=<rcept_no> (형식은 실제 응답으로 확인)
  stats:
  - 구간 건수
  - 가치 영향 태그 수
  - 검토 전
  - 후속 사건
  filters:
  - 전체
  - 가치 영향
  - 검토 전
  periodic: 정기보고서(사업·반기·분기보고서)는 태그 '재무 기준', 검토 칸 고정 '반영 · 재무 탭'(평가에 쓴 보고서) 또는 '참고'
  review: 그 밖 줄은 [반영 · 주석 · 해당 없음] → 세션 events_review(시각·버전·감사 기록) → 확정 시 보고서 '기준일 뒤 사건' 칸. 가치는 다시 계산하지 않음(반영은 사람이 가정·Bridge에서 직접)
  judgement_link: '판단 확인형 ''기준일 뒤 주요 공시''는 이 탭으로 옮긴다: 판단 목록·이력 화면에 보이지 않고, 검토 전 0건이 되면 그 항목을 ''그대로 유지''(이유 ''공시·이벤트 탭 검토'')로 처리'
  kind_rules:
  - kind: 정기
    words:
    - 사업보고서
    - 반기보고서
    - 분기보고서
  - kind: 지분
    words:
    - 대량보유
    - 소유상황보고서
    - 특정증권등소유
    - 최대주주등소유주식변동
  - kind: 주요
    words:
    - 주요사항보고서
  - kind: 발행
    words:
    - 증권신고서
    - 투자설명서
    - 증권발행실적
  - kind: 공정
    words:
    - 공정공시
  - kind: 기타
    words: []
  tags:
  - name: 주식수
    tab: dcf
    tip: 유상증자 · 무상증자 · CB/BW/EB · 자기주식 · 병합·분할 → 주당가치 분모
    words:
    - 유상증자
    - 무상증자
    - 전환사채
    - 신주인수권부사채
    - 교환사채
    - 자기주식
    - 주식병합
    - 주식분할
    - 감자결정
    - 주식매수선택권
    - 전환청구권행사
    - 신주인수권행사
    - 교환청구권행사
    - 추가상장
    - 변경상장
    not_words: []
    pblntf_detail:
    - B001
  - name: 순차입금
    tab: dcf
    tip: 차입 · 사채 발행 · 담보 제공 → EV → 주주가치
    words:
    - 차입
    - 사채발행
    - 사채권발행
    - 회사채
    - 담보제공
    not_words:
    - 전환사채
    - 신주인수권부사채
    - 교환사채
    pblntf_detail: []
  - name: 우발
    tab: dcf
    tip: 소송 · 채무보증 · 제재 → 우발채무 명세
    words:
    - 소송
    - 채무보증
    - 제재
    - 과징금
    - 횡령
    - 배임
    - 영업정지
    - 회생절차
    - 파산
    - 부도
    not_words: []
    pblntf_detail: []
  - name: 구조
    tab: premium
    tip: 합병 · 분할 · 영업양수도 · 최대주주 변경 · 경영권 계약 → 평가 경로·프리미엄
    words:
    - 합병
    - 회사분할
    - 분할합병
    - 물적분할
    - 인적분할
    - 영업양수
    - 영업양도
    - 최대주주변경
    - 경영권
    - 주식양수도
    - 공개매수
    - 타법인주식및출자증권양수
    - 타법인주식및출자증권양도
    - 자산양수도
    not_words: []
    pblntf_detail: []
  - name: 추정
    tab: assume
    tip: 잠정실적 · 단일판매·공급계약 · 신규 시설투자 → 매출·CAPEX 가정
    words:
    - 잠정
    - 영업실적
    - 손익구조
    - 단일판매
    - 공급계약
    - 시설투자
    not_words: []
    pblntf_detail: []
  tests: 태그마다 양성·음성 제목 2개 이상, 구간 분리, 검토 기록(세션·감사·보고서 칸)
