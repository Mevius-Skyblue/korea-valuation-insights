# 공개 축약본(P7-C3): 비공개 저장소 config/p7c3.yaml에서 공개 앱이 읽는 최상위 키만 (decisions)
decisions:
  premium_public:
    value: false
    rule: 경영권 프리미엄 집계(구간·사분위·이웃 건수)는 공개 스냅샷에 넣을 수 있게 만들되(설정 한 줄로 켬), 이번 배포의 기본값은 끈다. 공개 앱은 '경영권 프리미엄 집계는 한국거래소 서면 확인 뒤 공개(지금은 PC 모드에서만)'로 안내하고 블록 1주당 가격을 계산하지 않는다. 엑셀·보고서는 프리미엄·블록 칸을 '비공개'로 두고(수식 오류 없이)
      Checks·대조에서 그 항목을 뺀다
    why: 'CLAUDE.md 경영권 프리미엄 DB 절 ''원본 DB는 비공개. 집계 통계 공개는 KRX 서면 확인 후''와 P7-C2 사전 고정 ref_premium(''공개 배포에서의 집계 공개는 KRX 서면 확인 후'')이 아직 유효하다(서면 확인 기록 없음). 프롬프트 1번 표는 프리미엄 집계를 ''넣음''에 두었으므로 충돌 → 되돌릴 수 없는 공개
      쪽을 피하고 사용자 결정 사항으로 보고한다. 또 공개 모드의 시총 백분위는 사용자 시가총액과 그날 시장 전체 시가총액 분포(KRX 원값)가 있어야 계산되므로, 켤 때도 백분위 처리 방법(예: 기준일 백분위 고정)을 따로 정해야 한다'
  db_free:
    rule: 클라우드에는 프로젝트 DB(data/db)·data/raw·API 키·KRX 원값이 없다. 계산은 회사별 공개 스냅샷(JSON)만 읽는다(DuckDB 연결 없음)
  snapshot_mechanism:
    rule: '''자료 이음매(seam)'': 엔진이 DB를 읽는 함수 중 DART·ECOS 자료만 돌려주는 것(재무 표, D&A, 재무상태표 줄, 금리, 차입금 시점 값, 배당금수익, 피어 DART 지표, 원문 대사 결과, P5-B 참고 집계)과, KRX 유래 피어 자료를 집계로 바꾸는 함수(βu 중앙값, 배수 사분위, 목표 D/E)를 이음매로 감싼다.
      PC에서 스냅샷을 만들 때 이음매의 반환값을 기록하고(record), 클라우드는 같은 함수 호출을 기록에서 꺼낸다 (replay). 이음매 밖 계산 코드는 PC와 같은 함수 그대로. 기록에 없는 호출은 ''PC 모드에서만''(PublicDataUnavailable)으로 안내'
    pc_unchanged: 이음매는 기록·재생 모드가 아닐 때 원래 함수를 그대로 부른다 → PC·RF·JW 값 불변(회귀 시험)
  peer_change_public: '공개 배포에서는 피어 구성 변경(피어 빼기 후보·피어 직접 지정)을 계산하지 않는다: 피어 부분집합의 βu 중앙값·배수 사분위는 피어별 KRX 유래 값이 있어야 하고, 부분집합 중앙값을 여러 개 공개하면 피어별 값을 되짚을 수 있다. 그 칸은 ''PC 모드에서 계산(피어별 시세 필요)''으로 안내하고 βu·D/E 직접
    입력은 그대로 된다'
  kd_floor_note: 변경 없음(엔진 규칙 그대로)
