# 공개 축약본(P7-C3): 비공개 저장소 config/premium_p2c3.yaml에서 공개 앱이 읽는 최상위 키만 (application_rule, neighbours, quantile_regression)
quantile_regression:
  quantiles:
  - 0.25
  - 0.5
  - 0.75
  estimator: statsmodels QuantReg (default settings)
  ci: pairs bootstrap, 1,000 resamples, seed 20261002, percentile 95% CI
  fit_measure: Koenker-Machado pseudo R1 = 1 - V(model) / V(intercept only)
  cross_validation:
    folds: 5
    seed: 20261002
    split: random, deals shuffled once
    metrics:
    - 'mean pinball loss per quantile: model vs unconditional quantile of the training fold'
    - coverage of the predicted 25-75% interval in the test folds (expected about 50%)
    - number of crossing predictions (q25 > q50 or q50 > q75) in the test folds
neighbours:
  k: 50
  distance: '|mktcap_pct difference|'
  rule: same market first; if the market has fewer than 50 deals, fill with the nearest deals of the other market
  report: median, 25%, 75%, n
application_rule:
  decision: D6 (user, 2026-10-03)
  order:
  - market == KOSPI -> neighbours (reason rule_market)
  - market == KOSDAQ and mktcap_pct >= top_band_pct -> neighbours (reason rule_top_band)
  - regression adopted by the CV rule and a regression warning -> neighbours (reason warning)
  - regression adopted, no warning -> regression (reason cv_adopted)
  - regression not adopted -> band table (reason cv_not_adopted)
  top_band_pct: 80
  warning_triggers:
  - regression q50 vs neighbour median gap > 10%p
  regression_always_reported: true
