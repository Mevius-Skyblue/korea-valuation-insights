_public_note: 'P7-C3 공개 축약본: 자동 초안 계산이 읽는 절만(원본 config/valuation_rf.yaml)'
beta:
  basis: 'P1: KOSPI 기준 R² ≤ 0.07 → KOSDAQ. 지수·자본구조 관행은 ⚠️'
  blume:
    constant: 0.33
    weight_raw: 0.67
  de_rule: 각 회사 회귀 기간 안 재무상태표 시점(FY·H1) D/E의 평균. D = 총차입금 + 리스부채, E = 그 날(직전 거래일)
    시가총액
  options:
  - freq: monthly
    index: KOSDAQ
    years: 5
  - freq: weekly
    index: KOSPI
    years: 2
  - label: RF 자체 베타(Blume)
    source: target
  peer_statistic: median
  peer_tiers:
  - core
  - extended
  regression:
    adjust: blume
    freq: weekly
    index: KOSDAQ
    years: 2
  short_history_rule: 스팩 합병 등 이력이 짧은 회사(라이콤, 코스텍시스)도 주간 2년 사용, 월간 5년은 표시만
  source: 정보 단말 기본 설정(주간 2년·Blume), Hamada 실무 표준(docs/p3_inputs_research.md 1절)
  status: 🔸
  tax_for_hamada: 0.22
  tax_for_hamada_options:
  - 0.242
  unlever: hamada
capital_structure:
  basis: RF 기준일 D/E(주가 급등)와 기간평균이 크게 다름 → 피어 중앙값을 목표로, 두 값은 민감도
  source: 프로젝트 가정
  status: ⚠️
corporate_tax:
  basis: law.go.kr 개정이유·국회예산정책처 확인. 중소기업 세액감면(조특법 제7조)은 RF 해당 여부 미확인 → 기본 미적용(⚠️),
    민감도
  brackets:
  - from: 0
    rate: 0.11
    to: 200000000
  - from: 200000000
    rate: 0.22
    to: 20000000000
  - from: 20000000000
    rate: 0.242
    to: 300000000000
  - from: 300000000000
    rate: 0.275
    to: null
  dcf_method: progressive
  regime: 2026~
  sme_tax_credit:
    applied: false
    options:
    - true
    rate_range:
    - 0.05
    - 0.3
  source: 법인세법(법률 제21217호, 2025-12-23 공포, 2026-01-01 시행), 지방세법 제103조의20(법률 제21308호)
  status: ✅
  wacc_method: marginal
cost_of_debt:
  basis: RF는 무등급. 실제 차입은 방위사업 이차보전·상생대출(0.74~0.86%)이 대부분이라 시장 조달비용이 아님 → BBB- 기본(보수적),
    실제 이자율 병기. D/E가 작아 WACC 영향 작음
  source: ECOS 817Y002 2026-09-30, RF 2026 반기보고서 주석 16(20260814001631)
  status: ⚠️
dcf:
  basis: '기준 시점 일치(사용자 수정 2026-10-03): 7~9월 현금흐름 포함. 2032 성장률(기본 10%)에서 영구성장률로 한 번에
    내려가는 단절은 민감도 후보'
  cash_flow_start: '2026-07-01'
  discount_date: '2026-06-30'
  exit_multiple:
    basis: 피어 core+extended EV/EBITDA 중앙값(n=5, P3-A peer_p3, LTM 2026H1)
    value: 14.57
  explicit_end: 2032
  mid_year: true
  roll_forward: wacc
  source: 프로젝트 가정
  status: ⚠️
  terminal:
